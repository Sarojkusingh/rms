{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="rms-card">
            <h4 class="mb-4 font-heading fw-semibold border-bottom pb-2">{{ title }}</h4>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="department" class="form-label fw-semibold">Department</label>
                    <select id="department" name="department" class="form-select" required>
                        <option value="">Select Department</option>
                        {% for dept in departments %}
                            <option value="{{ dept.id }}" {% if program.department.id == dept.id %}selected{% endif %}>{{ dept.code }} - {{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Program Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Bachelor of Technology in CS" value="{{ program.name|default:'' }}" required>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-6 mb-3">
                        <label for="code" class="form-label fw-semibold">Program Code</label>
                        <input type="text" id="code" name="code" class="form-control" placeholder="e.g. BTECH-CS" value="{{ program.code|default:'' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="duration_years" class="form-label fw-semibold">Duration (Years)</label>
                        <input type="number" id="duration_years" name="duration_years" class="form-control" min="1" max="6" value="{{ program.duration_years|default:4 }}" required>
                    </div>
                </div>
                
                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a href="{% url 'program_list' %}" class="btn btn-light fw-semibold">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">Save Program</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
