{% if breadcrumbs %}
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb bg-transparent p-0 m-0">
            <li class="breadcrumb-item">
                <a href="{% url 'dashboard' %}" class="text-decoration-none text-secondary">
                    <i class="bi bi-house-door-fill me-1"></i>Home
                </a>
            </li>
            {% for crumb in breadcrumbs %}
                {% if forloop.last %}
                    <li class="breadcrumb-item active text-dark fw-semibold" aria-current="page">{{ crumb.name }}</li>
                {% else %}
                    <li class="breadcrumb-item">
                        <a href="{{ crumb.url }}" class="text-decoration-none text-secondary">{{ crumb.name }}</a>
                    </li>
                {% endif %}
            {% endfor %}
        </ol>
    </nav>
{% endif %}
