{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="rms-card">
            <h4 class="mb-4 font-heading fw-semibold border-bottom pb-2">Change Password</h4>
            
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex justify-content-end gap-2 border-top pt-3 mt-4">
                    <a href="{% url 'profile' %}" class="btn btn-light fw-semibold">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">Update Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
