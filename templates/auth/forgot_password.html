{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        
        <div class="text-center mb-4">
            <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
            <h2 class="mt-2 font-heading fw-bold">RMS SaaS</h2>
            <p class="text-muted">Reset Your Account Password</p>
        </div>

        <div class="rms-card p-4">
            <h4 class="mb-3 font-heading fw-semibold">Forgot Password</h4>
            <p class="text-muted mb-4" style="font-size: 0.85rem;">Enter your email address and we'll send you a recovery link.</p>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="email" class="form-label fw-medium">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your registered email" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="border-radius: var(--radius-md);">
                    Send Reset Link <i class="bi bi-envelope-at ms-1"></i>
                </button>
            </form>
        </div>

        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
