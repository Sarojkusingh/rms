{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        
        <div class="text-center mb-4">
            <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
            <h2 class="mt-2 font-heading fw-bold">RMS SaaS</h2>
            <p class="text-muted">Enter New Account Password</p>
        </div>

        <div class="rms-card p-4">
            <h4 class="mb-3 font-heading fw-semibold">Reset Password</h4>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="new_password" class="form-label fw-medium">New Password</label>
                    <input type="password" id="new_password" name="password" class="form-control" placeholder="Enter new password" required>
                </div>
                
                <div class="mb-4">
                    <label for="confirm_password" class="form-label fw-medium">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="border-radius: var(--radius-md);">
                    Save Password & Login
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
